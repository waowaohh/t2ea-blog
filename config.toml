baseURL = 'https://waowaohh.github.io/t2ea-blog/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'T2EA 技术博客 & 自动控制题库'
theme = 'PaperMod'
paginate = 10

[params]
  author = 'T2EA Research'
  description = 'T2EA - 基于泰勒展开的图像融合网络技术深度解析 + 自动控制原理 & 微型计算机原理题库（含答案解析）'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

[params.homeInfoParams]
  Title = "T2EA 技术博客"
  Content = "**T2EA 技术深度解析**：基于泰勒展开的图像融合网络完整技术剖析。\n\n**📚 自动控制原理 & 微型计算机原理题库**：220道精选题目，含完整答案、详细解析与讲解，助力期末复习与考研备考。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/waowaohh/t2ea-blog"

[params.editPost]
  URL = "tree/main/content"
  Text = "在 GitHub 上编辑"
  appendFilePath = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true
    [markup.goldmark.extensions]
      strikethrough = false
      typographer = false

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "qbank"
  name = "题库"
  url = "/qbank/"
  weight = 15

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 40
